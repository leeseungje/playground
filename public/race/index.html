<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1a12" />
    <title>사내 경마</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏇</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/race.css" />
  </head>
  <body class="race-page">
    <!-- 입장 -->
    <section id="lobby" class="lobby race-lobby">
      <div class="lobby-card">
        <div class="brand">
          <span class="brand-mark race-mark">🏇</span>
          <div>
            <h1>사내 경마</h1>
            <p>가상 칩으로 즐기는 실시간 경마 · 마권 7종 · 실황 중계</p>
          </div>
        </div>
        <label class="field">
          <span>닉네임</span>
          <input id="nameInput" maxlength="12" placeholder="예: 승제" autocomplete="off" />
        </label>
        <button id="createBtn" class="btn primary big">새 경마장 열기</button>
        <div class="divider"><span>초대 코드로 입장</span></div>
        <div class="join-row">
          <input id="codeInput" maxlength="4" placeholder="ABCD" autocomplete="off" aria-label="초대 코드 4자리" />
          <button id="joinBtn" class="btn">입장</button>
        </div>
        <p id="lobbyError" class="error" role="alert"></p>
        <ul class="lobby-points">
          <li>결과는 발매가 마감된 뒤에 서버가 정해요. 미리 알 수 없어요.</li>
          <li>배당은 실제 경마처럼 매출에 따라 바뀌고 마감 때 확정돼요.</li>
        </ul>
        <a class="game-switch" href="/">♠ 텍사스 홀덤으로 가기</a>
      </div>
    </section>

    <!-- 경마장 -->
    <section id="game" class="game race-game hidden">
      <header class="topbar">
        <div class="tb-left">
          <span class="brand-mark sm race-mark">🏇</span>
          <div class="room-chip">
            <span class="muted hide-sm">경마장</span>
            <strong id="roomCode"></strong>
            <button id="copyBtn" class="btn small" title="초대 링크 복사">초대<span class="hide-sm"> 링크 복사</span></button>
          </div>
          <div class="race-info" id="raceInfo"></div>
        </div>
        <div class="tb-right">
          <div class="phase-chip" id="phaseChip"></div>
          <button id="startBtn" class="btn primary hidden">경마 시작</button>
          <button id="pauseBtn" class="btn hidden"><span class="hide-sm">이번 경주 후 </span>멈춤</button>
          <button id="settingsBtn" class="btn icon" title="발매 시간 설정" aria-label="발매 시간 설정">⚙</button>
          <button id="soundBtn" class="btn icon" title="소리" aria-label="소리 켜기/끄기">🔊</button>
          <button id="leaveBtn" class="btn ghost">나가기</button>
        </div>
      </header>
      <div id="offline" class="offline hidden">서버와 연결이 끊겼어요. 다시 연결하는 중…</div>

      <div class="race-main">
        <div class="race-left">
          <div class="track-wrap" id="trackWrap">
            <div class="caster" id="caster"><span class="caster-mic">🎙</span><span id="casterText"></span></div>
          </div>
          <div class="card-area" id="cardArea"></div>
        </div>
        <aside class="race-right">
          <div class="slip" id="slip"></div>
          <div class="race-panel" id="racePanel"></div>
        </aside>
      </div>
    </section>

    <div id="resultLayer" class="result-layer hidden"></div>
    <div id="toast" class="toast" role="status"></div>
    <input id="copyFallback" class="sr-only" aria-hidden="true" tabindex="-1" />

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/race/main.js"></script>
  </body>
</html>
