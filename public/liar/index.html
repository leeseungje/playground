<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14101c" />
    <title>라이어 찾기</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/liar.css" />
  </head>
  <body class="liar-page">
    <section id="lobby" class="lobby liar-lobby">
      <div class="lobby-card">
        <div class="brand">
          <span class="brand-mark liar-mark">🕵️</span>
          <div>
            <h1>라이어 찾기</h1>
            <p>한 명만 제시어를 몰라요. 힌트와 눈치로 라이어를 찾아라!</p>
          </div>
        </div>
        <label class="field">
          <span>닉네임</span>
          <input id="nameInput" maxlength="12" placeholder="예: 승제" autocomplete="off" />
        </label>
        <button id="createBtn" class="btn primary big">새 방 만들기</button>
        <div class="divider"><span>초대 코드로 입장</span></div>
        <div class="join-row">
          <input id="codeInput" maxlength="4" placeholder="ABCD" autocomplete="off" aria-label="초대 코드 4자리" />
          <button id="joinBtn" class="btn">입장</button>
        </div>
        <p id="lobbyError" class="error" role="alert"></p>
        <ul class="lobby-points">
          <li>3~12명이 함께해요. 제시어는 서버가 시민에게만 보내요.</li>
          <li>힌트는 글로 쓰거나, 화상회의에서 말로 하고 「말로 했어요」를 눌러도 돼요.</li>
        </ul>
        <a class="game-switch" href="/">♠ 홀덤</a>
        <a class="game-switch" href="/race/">🏇 경마</a>
      </div>
    </section>

    <section id="game" class="game liar-game hidden">
      <header class="topbar">
        <div class="tb-left">
          <span class="brand-mark sm liar-mark">🕵️</span>
          <div class="room-chip">
            <span class="muted hide-sm">방</span>
            <strong id="roomCode"></strong>
            <button id="copyBtn" class="btn small" title="초대 링크 복사">초대<span class="hide-sm"> 링크 복사</span></button>
          </div>
          <div class="round-info" id="roundInfo"></div>
        </div>
        <div class="tb-right">
          <div class="phase-chip" id="phaseChip"></div>
          <button id="skipBtn" class="btn hidden">넘기기</button>
          <button id="startBtn" class="btn primary hidden">게임 시작</button>
          <button id="rulesBtn" class="btn icon" title="규칙" aria-label="규칙 보기">❓</button>
          <button id="settingsBtn" class="btn icon" title="방 설정" aria-label="방 설정">⚙</button>
          <button id="soundBtn" class="btn icon" title="소리" aria-label="소리 켜기/끄기">🔊</button>
          <button id="leaveBtn" class="btn ghost">나가기</button>
        </div>
      </header>
      <div id="offline" class="offline hidden">서버와 연결이 끊겼어요. 다시 연결하는 중…</div>

      <div class="liar-main">
        <div class="liar-left">
          <div class="host-row">
            <div class="host-avatar" aria-hidden="true">🕵️</div>
            <div class="host-bubble" id="hostLine" role="status" aria-live="polite"></div>
          </div>
          <div class="center-row">
            <div class="my-card-wrap" id="cardWrap"></div>
            <div class="action-box" id="actionBox"></div>
          </div>
          <div class="players-grid" id="players"></div>
        </div>
        <aside class="liar-right" id="sidePanel"></aside>
      </div>
    </section>

    <div id="toast" class="toast" role="status"></div>
    <input id="copyFallback" class="sr-only" aria-hidden="true" tabindex="-1" />
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/liar/main.js"></script>
  </body>
</html>
